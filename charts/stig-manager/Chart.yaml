apiVersion: v2
name: stig-manager
description: |
  STIG Manager — an API and web client for managing the assessment of information
  systems against DISA Security Technical Implementation Guides (STIGs). This chart
  deploys the application only; it expects an externally managed MySQL database and
  an externally managed OIDC provider.
type: application

# Chart version. Bump on every change to the chart itself.
version: 0.2.1

# Version of STIG Manager this chart deploys by default.
appVersion: "1.6.15"

kubeVersion: ">=1.25.0-0"

home: https://github.com/NUWCDIVNPT/stig-manager
sources:
  - https://github.com/NUWCDIVNPT/stig-manager
  - https://github.com/NUWCDIVNPT/stig-manager/pkgs/container/stig-manager

keywords:
  - stig
  - stig-manager
  - disa
  - compliance
  - security
  - rmf
  - ckl

maintainers:
  - name: watsonx11
    url: https://github.com/watsonx11

annotations:
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/links: |
    - name: Upstream project
      url: https://github.com/NUWCDIVNPT/stig-manager
    - name: Documentation
      url: https://stig-manager.readthedocs.io/
    - name: Environment variable reference
      url: https://stig-manager.readthedocs.io/en/latest/installation-and-setup/envvars.html
  artifacthub.io/images: |
    - name: stig-manager
      image: nuwcdivnpt/stig-manager:1.6.15
  artifacthub.io/changes: |
    - kind: added
      description: MIT LICENSE, backing the license this chart already declared
    - kind: changed
      description: README documents installing from the published chart repository
    - kind: fixed
      description: extraManifests examples use current CRD apiVersions
