# Default values for stig-manager.
#
# This chart deploys the STIG Manager application only. It ships no database:
# point `database.*` at an externally managed MySQL 8 instance. It also ships no
# service-mesh, Gateway-API or secret-manager objects — use `extraManifests` to
# layer those on from your own values overlay.
#
# Every STIGMAN_* variable the application understands is reachable from here.
# Any value left `null` is NOT written to the ConfigMap, so the application's own
# default applies. The comment on each key records that upstream default.
# Reference: https://stig-manager.readthedocs.io/en/latest/installation-and-setup/envvars.html

# -- Override the chart name used in resource names and labels.
# @section -- Naming, image and workload
nameOverride: ""
# -- Override the fully qualified release name.
# @section -- Naming, image and workload
fullnameOverride: ""

image:
  # -- Image registry. Leave empty to use the repository as written (Docker Hub).
  # @section -- Naming, image and workload
  registry: ""
  # -- Image repository.
  # @section -- Naming, image and workload
  repository: nuwcdivnpt/stig-manager
  # -- Image tag. Defaults to the chart's appVersion.
  # @section -- Naming, image and workload
  tag: ""
  # -- Pull by digest instead of tag (e.g. `sha256:abc...`). Wins over `tag`.
  # @section -- Naming, image and workload
  digest: ""
  # -- Image pull policy.
  # @section -- Naming, image and workload
  pullPolicy: IfNotPresent

# -- Image pull secrets applied to the pod.
# @section -- Naming, image and workload
imagePullSecrets: []
#  - name: regcred

# -- Number of API replicas. The API is stateless; all state lives in MySQL.
# @section -- Naming, image and workload
replicaCount: 1

# -- Deployment update strategy.
# @section -- Naming, image and workload
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# -- How many old ReplicaSets to retain.
# @section -- Naming, image and workload
revisionHistoryLimit: 3

serviceAccount:
  # -- Create a ServiceAccount for the pod.
  # @section -- Naming, image and workload
  create: true
  # -- Name of the ServiceAccount. Generated from the release name when empty.
  # @section -- Naming, image and workload
  name: ""
  # -- Extra annotations for the ServiceAccount.
  # @section -- Naming, image and workload
  annotations: {}
  # -- Extra labels for the ServiceAccount.
  # @section -- Naming, image and workload
  labels: {}
  # -- Mount a token into pods that use this ServiceAccount by default.
  # @section -- Naming, image and workload
  automountServiceAccountToken: false
  # -- Image pull secrets attached to the ServiceAccount.
  # @section -- Naming, image and workload
  imagePullSecrets: []

# -- Mount the ServiceAccount token in the API pod. The application never calls
# the Kubernetes API, so this stays off.
# @section -- Naming, image and workload
automountServiceAccountToken: false

# ==============================================================================
# Application configuration (STIGMAN_*)
# ==============================================================================

# -- STIGMAN_CLASSIFICATION. Classification banner rendered by the web client.
# One of: NONE, U, CUI, C, S, TS, SCI. Upstream default: U.
# @section -- Application
classification: U

api:
  # -- STIGMAN_API_PORT. TCP port the API listens on. Also the container port.
  # @section -- Application
  port: 54000
  # -- STIGMAN_API_ADDRESS. Listen address. Upstream default: 0.0.0.0.
  # @section -- Application
  address: null
  # -- STIGMAN_API_MAX_JSON_BODY. Max application/json request body, in bytes.
  # Upstream default: 5242880.
  # @section -- Application
  maxJsonBody: null
  # -- STIGMAN_API_MAX_UPLOAD. Max multipart/form-data upload, in bytes.
  # Upstream default: 1073741824.
  # @section -- Application
  maxUpload: null

# ==============================================================================
# Connecting to an external MySQL
# ==============================================================================
# STIG Manager requires MySQL 8. This chart does not deploy one. Create the
# schema and a user with full rights on it, then either:
#
#   a) set `database.password` here (the chart templates a Secret), or
#   b) point `database.existingSecret` at a Secret you manage yourself — from
#      External Secrets, SOPS, a Vault/OpenBao injector, anything. In that case
#      set `database.secretKeys.password` to whatever key that Secret uses:
#
#        database:
#          existingSecret: stigman-db
#          secretKeys:
#            password: mysql_password
#
# `existingSecret` always wins: when it is set the chart renders no Secret of
# its own and never reads `database.password`.
database:
  # -- STIGMAN_DB_HOST. Hostname or IP of the MySQL server.
  # @section -- Database
  host: mysql
  # -- STIGMAN_DB_PORT. MySQL TCP port.
  # @section -- Database
  port: 3306
  # -- STIGMAN_DB_SCHEMA. Schema holding the STIG Manager objects.
  # @section -- Database
  schema: stigman
  # -- STIGMAN_DB_USER. MySQL user.
  # @section -- Database
  user: stigman
  # -- Password for `database.user`. Ignored when `existingSecret` is set.
  # @section -- Database
  password: ""
  # -- Name of an existing Secret carrying the database credentials. Wins over
  # `database.password`; when set, no Secret is created by this chart.
  # @section -- Database
  existingSecret: ""
  # -- Keys within the Secret (chart-managed or existing).
  # @section -- Database
  secretKeys:
    # -- Key holding the database password (STIGMAN_DB_PASSWORD).
    # @section -- Database
    password: db-password
    # -- Key holding the database TLS private key passphrase, if your tooling
    # stores one. Not consumed by the application today; kept so a single Secret
    # can carry it for use via `extraEnvVars`.
    # @section -- Database
    dbTlsKeyPassphrase: db-tls-key-passphrase
    # -- Key holding the API server TLS private key passphrase
    # (STIGMAN_API_TLS_KEY_PASSPHRASE).
    # @section -- Database
    apiTlsKeyPassphrase: api-tls-key-passphrase
  # -- STIGMAN_DB_MAX_CONNECTIONS. Connection pool size. Upstream default: 25.
  # @section -- Database
  maxConnections: null

  # TLS to the database. Mount the PEM material from a Secret you manage; the
  # file names below are keys within that Secret.
  tls:
    # -- Enable TLS to MySQL. Requires `existingSecret`.
    # @section -- Database
    enabled: false
    # -- Secret holding the database TLS material.
    # @section -- Database
    existingSecret: ""
    # -- Where the material is mounted in the container.
    # @section -- Database
    mountPath: /etc/stigman/db-tls
    # -- STIGMAN_DB_TLS_CA_FILE. Key in the Secret holding the CA certificate.
    # Setting this is what enables TLS connections to the database.
    # @section -- Database
    caFile: ca.pem
    # -- STIGMAN_DB_TLS_CERT_FILE. Client certificate, for mTLS. Optional.
    # @section -- Database
    certFile: ""
    # -- STIGMAN_DB_TLS_KEY_FILE. Client private key, for mTLS. Optional.
    # @section -- Database
    keyFile: ""
    # -- Passphrase for the client private key. Stored under
    # `database.secretKeys.dbTlsKeyPassphrase` in the chart-managed Secret.
    # @section -- Database
    keyPassphrase: ""

# ==============================================================================
# OIDC / authentication
# ==============================================================================
oidc:
  # -- STIGMAN_OIDC_PROVIDER. Base URL of the OIDC issuer.
  # `/.well-known/openid-configuration` is appended when fetching metadata.
  # e.g. `https://keycloak.example.com/realms/stigman`
  # @section -- OIDC
  provider: ""
  # -- STIGMAN_CLIENT_OIDC_PROVIDER. Web-client override of the issuer URL, for
  # split-horizon DNS where the browser and the API reach the IdP differently.
  # @section -- OIDC
  clientProvider: null
  # -- STIGMAN_JWT_AUD_VALUE. Required `aud` claim value. Unset disables the check.
  # @section -- OIDC
  audience: null
  # -- STIGMAN_JWKS_CACHE_MAX_AGE. Minutes before the JWKS cache is stale.
  # Upstream default: 10.
  # @section -- OIDC
  jwksCacheMaxAge: null
  # Access-token claim names. Leave null to use the upstream defaults, which
  # match a stock Keycloak realm.
  claims:
    # -- STIGMAN_JWT_USERNAME_CLAIM. Upstream default: preferred_username.
    # @section -- OIDC
    username: null
    # -- STIGMAN_JWT_NAME_CLAIM. Upstream default: name.
    # @section -- OIDC
    name: null
    # -- STIGMAN_JWT_EMAIL_CLAIM. Upstream default: email.
    # @section -- OIDC
    email: null
    # -- STIGMAN_JWT_PRIVILEGES_CLAIM. Upstream default: realm_access.roles.
    # @section -- OIDC
    privileges: null
    # -- STIGMAN_JWT_SCOPE_CLAIM. Upstream default: scope.
    # @section -- OIDC
    scope: null
    # -- STIGMAN_JWT_SERVICENAME_CLAIM. Upstream default: clientId.
    # @section -- OIDC
    serviceName: null
    # -- STIGMAN_JWT_ASSERTION_CLAIM. Upstream default: jti.
    # @section -- OIDC
    assertion: null

# ==============================================================================
# Reference web client
# ==============================================================================
client:
  # -- STIGMAN_CLIENT_ID. OIDC clientId the web client authenticates with.
  # Upstream default: stig-manager.
  # @section -- Web client
  id: stig-manager
  # -- STIGMAN_CLIENT_DISABLED. `true` stops the API serving the web client.
  # @section -- Web client
  disabled: null
  # -- STIGMAN_CLIENT_DIRECTORY. Location of the client files inside the image.
  # @section -- Web client
  directory: null
  # -- STIGMAN_CLIENT_API_BASE. Base URL for client → API requests, relative to
  # window.location. Upstream default: api.
  # @section -- Web client
  apiBase: null
  # -- STIGMAN_CLIENT_SCOPE_PREFIX. Prefix added to each requested scope. Needed
  # by providers such as Entra ID (`api://<app-id>/`).
  # @section -- Web client
  scopePrefix: null
  # -- STIGMAN_CLIENT_EXTRA_SCOPES. Space-separated extra OAuth2 scopes, e.g.
  # `offline_access` for Okta.
  # @section -- Web client
  extraScopes: null
  # -- STIGMAN_CLIENT_REAUTH_ACTION. How to re-prompt on token expiry:
  # popup, iframe, tab or reload. Upstream default: popup.
  # @section -- Web client
  reauthAction: null
  # -- STIGMAN_CLIENT_RESPONSE_MODE. Deprecated upstream. query or fragment.
  # @section -- Web client
  responseMode: null
  # -- STIGMAN_CLIENT_USER_TIMEOUT. Idle minutes before a regular user must
  # re-authenticate. 0 disables idle detection. Upstream default: 60.
  # @section -- Web client
  userTimeout: null
  # -- STIGMAN_CLIENT_ADMIN_TIMEOUT. Same, for admin users. Upstream default: 10.
  # @section -- Web client
  adminTimeout: null
  # -- STIGMAN_CLIENT_STATE_EVENTS. Whether the client consumes server-sent
  # events about API state. Disable only to work around proxy buffering.
  # @section -- Web client
  stateEvents: null
  # -- STIGMAN_CLIENT_STRICT_PKCE. Whether the client requires the provider to
  # advertise PKCE/S256 per RFC 8414.
  # @section -- Web client
  strictPkce: null
  # -- STIGMAN_CLIENT_CONSOLE_MODE. Browser console verbosity. Upstream
  # default: production.
  # @section -- Web client
  consoleMode: null
  # -- STIGMAN_CLIENT_DISPLAY_APPMANAGERS. Show application managers on the home
  # page.
  # @section -- Web client
  displayAppManagers: null
  welcome:
    # -- STIGMAN_CLIENT_WELCOME_TITLE. Title of the Home tab welcome widget.
    # @section -- Web client
    title: null
    # -- STIGMAN_CLIENT_WELCOME_MESSAGE. Body text of the welcome widget.
    # @section -- Web client
    message: null
    # -- STIGMAN_CLIENT_WELCOME_LINK. Link rendered after the welcome message.
    # @section -- Web client
    link: null
    # -- STIGMAN_CLIENT_WELCOME_IMAGE. URL of an externally hosted image. The
    # application does not serve this image itself.
    # @section -- Web client
    image: null

# ==============================================================================
# SwaggerUI (/api-docs)
