  # @section -- SwaggerUI
  redirect: null
  # -- STIGMAN_SWAGGER_OIDC_PROVIDER. SwaggerUI override of the issuer URL.
  # @section -- SwaggerUI
  oidcProvider: null

# ==============================================================================
# Documentation (/docs)
# ==============================================================================
docs:
  # -- STIGMAN_DOCS_DISABLED. `true` stops the API serving the documentation.
  # @section -- Documentation
  disabled: null
  # -- STIGMAN_DOCS_DIRECTORY. Location of the docs inside the image.
  # @section -- Documentation
  directory: null

# ==============================================================================
# Logging and startup behaviour
# ==============================================================================
logging:
  # -- STIGMAN_LOG_LEVEL. 1 (error) to 4 (debug). Upstream default: 3.
  # @section -- Logging, startup and extra configuration
  level: null
  # -- STIGMAN_LOG_MODE. `combined` for one entry per request/response pair,
  # `separate` for two. Upstream default: combined.
  # @section -- Logging, startup and extra configuration
  mode: null

# -- STIGMAN_DEPENDENCY_RETRIES. Startup retries against MySQL and the OIDC
# provider before giving up. Upstream default: 24.
# @section -- Logging, startup and extra configuration
dependencyRetries: null

experimental:
  # -- STIGMAN_EXPERIMENTAL_APPDATA. Enable the AppData import/export endpoints.
  # @section -- Logging, startup and extra configuration
  appData: null
  # -- STIGMAN_EXPERIMENTAL_LOGSTREAM. WebSocket log stream at /socket/.
  # Upstream default: true.
  # @section -- Logging, startup and extra configuration
  logStream: null

dev:
  # -- STIGMAN_DEV_ALLOW_INSECURE_TOKENS. Accept known-insecure JWT signing keys.
  # Development and testing only.
  # @section -- Logging, startup and extra configuration
  allowInsecureTokens: null
  # -- STIGMAN_DEV_RESPONSE_VALIDATION. `none` or `logOnly`.
  # @section -- Logging, startup and extra configuration
  responseValidation: null
  # -- STIGMAN_DEV_LOG_OPT_STATS. Track operation statistics for /op/appinfo.
  # @section -- Logging, startup and extra configuration
  logOptStats: null

# -- Raw STIGMAN_* passthrough, merged into the ConfigMap last and therefore
# able to override anything above. Use for variables this chart does not model
# yet. Keys must be the literal environment variable names.
# @section -- Logging, startup and extra configuration
extraConfig: {}
#  STIGMAN_SOME_NEW_VAR: "value"

# ==============================================================================
# Custom CA certificates
# ==============================================================================
# The API must complete TLS to your OIDC provider (and optionally to MySQL). If
# either presents a certificate from a private CA, the certificate chain has to
# be inside the container. Both NODE_EXTRA_CA_CERTS and STIGMAN_OIDC_CA_CERTS
# take exactly one file path, so every PEM supplied here is concatenated into a
# single bundle.
#
# Inline form — the chart creates the ConfigMap:
#
#   trustedCAs:
#     enabled: true
#     certs:
#       corporate-root: |
#         -----BEGIN CERTIFICATE-----
#         ...
#         -----END CERTIFICATE-----
#       corporate-intermediate: |
#         -----BEGIN CERTIFICATE-----
#         ...
#         -----END CERTIFICATE-----
#
# Existing-object form — bring your own, e.g. one written by cert-manager or by
# a trust-manager Bundle:
#
#   trustedCAs:
#     enabled: true
#     existingConfigMap: corporate-ca-bundle
#     bundleKey: ca-bundle.pem      # the key within that ConfigMap
trustedCAs:
  # -- Mount a CA bundle and point the application at it.
  # @section -- Trusted CA certificates
  enabled: false
  # -- Map of name → PEM. Concatenated in key order into one bundle file.
  # @section -- Trusted CA certificates
  certs: {}
  # -- Use an existing ConfigMap instead of `certs`. Mutually exclusive with
  # `existingSecret`.
  # @section -- Trusted CA certificates
  existingConfigMap: ""
  # -- Use an existing Secret instead of `certs`. Mutually exclusive with
  # `existingConfigMap`.
  # @section -- Trusted CA certificates
  existingSecret: ""
  # -- Key within the ConfigMap/Secret, and the file name once mounted.
  # @section -- Trusted CA certificates
  bundleKey: ca-bundle.pem
  # -- Directory the bundle is mounted into.
  # @section -- Trusted CA certificates
  mountPath: /etc/stigman/ca
  # -- Set NODE_EXTRA_CA_CERTS to the bundle (trust for all Node TLS clients).
  # @section -- Trusted CA certificates
  setNodeExtraCaCerts: true
  # -- Set STIGMAN_OIDC_CA_CERTS to the bundle (trust for OIDC calls only).
  # @section -- Trusted CA certificates
  setOidcCaCerts: true

# ==============================================================================
# TLS on the API listener
# ==============================================================================
# Only needed when the pod must serve HTTPS itself. Most deployments terminate
# TLS at an ingress controller or a service mesh and leave this off.
tls:
  # -- Serve HTTPS directly from the API container. Requires `existingSecret`.
  # @section -- API TLS
  enabled: false
  # -- Secret holding the server certificate and key.
  # @section -- API TLS
  existingSecret: ""
  # -- Where that Secret is mounted.
  # @section -- API TLS
  mountPath: /etc/stigman/tls
  # -- STIGMAN_API_TLS_CERT_FILE. Key in the Secret holding the certificate.
  # @section -- API TLS
  certFile: tls.crt
  # -- STIGMAN_API_TLS_KEY_FILE. Key in the Secret holding the private key.
  # @section -- API TLS
  keyFile: tls.key
  # -- STIGMAN_API_TLS_KEY_PASSPHRASE, if the key is encrypted.
  # @section -- API TLS
  keyPassphrase: ""

# ==============================================================================
# Service
# ==============================================================================
service:
  # -- Service type.
  # @section -- Service
  type: ClusterIP
  # -- Service port.
  # @section -- Service
  port: 80
  # -- Target port. Defaults to the container's named `http` port.
  # @section -- Service
  targetPort: ""
  # -- Node port, when `type` is NodePort.
  # @section -- Service
  nodePort: null
  # -- Explicit clusterIP, or `None` for a headless Service.
  # @section -- Service
  clusterIP: ""
  # -- LoadBalancer IP request.
  # @section -- Service
  loadBalancerIP: ""
  # -- LoadBalancer implementation class.
  # @section -- Service
  loadBalancerClass: ""
  # -- Source ranges permitted to reach a LoadBalancer Service.
  # @section -- Service
  loadBalancerSourceRanges: []
  # -- externalTrafficPolicy for NodePort/LoadBalancer Services.
  # @section -- Service
  externalTrafficPolicy: ""
  # -- Session affinity: None or ClientIP.
  # @section -- Service
  sessionAffinity: ""
  # -- Session affinity tuning.
  # @section -- Service
  sessionAffinityConfig: {}
  # -- IP family policy.
  # @section -- Service
  ipFamilyPolicy: ""
  # -- IP families.
  # @section -- Service
  ipFamilies: []
  # -- Extra Service annotations.
  # @section -- Service
  annotations: {}
  # -- Extra Service labels.
  # @section -- Service
  labels: {}
  # -- Additional Service ports, e.g. for a sidecar.
  # @section -- Service
  extraPorts: []

# ==============================================================================
# Ingress (networking.k8s.io/v1 only)
# ==============================================================================
# STIG Manager serves everything from one origin, so a single `/` Prefix rule is
# usually right. Split it only when a platform routes the sub-paths separately:
#
#   paths:
#     - {path: /,         pathType: Prefix}   # web client
#     - {path: /api,      pathType: Prefix}   # API
#     - {path: /docs,     pathType: Prefix}   # documentation
#     - {path: /api-docs, pathType: Prefix}   # SwaggerUI
#     - {path: /socket,   pathType: Prefix}   # log-stream WebSocket
#
# The WebSocket at /socket/ needs an ingress controller configured to upgrade
# connections; with ingress-nginx that is the default.
ingress:
  # -- Create an Ingress.
  # @section -- Ingress
  enabled: false
  # -- ingressClassName.
  # @section -- Ingress
  className: ""
  # -- Ingress annotations.
  # @section -- Ingress
  annotations: {}
  # -- Ingress labels.
  # @section -- Ingress
  labels: {}
  # -- Hosts and their paths. `host` is rendered through `tpl`.
  # @section -- Ingress
  hosts:
    - host: stig-manager.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS blocks.
  # @section -- Ingress
  tls: []
  #  - secretName: stig-manager-tls
  #    hosts:
  #      - stig-manager.local
  # -- Verbatim extra rules, appended to `rules`. Rendered through `tpl`.
  # @section -- Ingress
  extraRules: []
  # -- Verbatim extra TLS blocks. Rendered through `tpl`.
  # @section -- Ingress
  extraTls: []

# ==============================================================================
# NetworkPolicy
# ==============================================================================
networkPolicy:
  # -- Create a NetworkPolicy for the API pod.
  # @section -- NetworkPolicy
  enabled: false
  # -- Accept ingress from anywhere on the API port. When false, only
  # `allowedIngress` peers are accepted.
  # @section -- NetworkPolicy
  allowAllIngress: false
  # -- Peers permitted to reach the API port: podSelector, namespaceSelector
  # and/or ipBlock entries, exactly as the NetworkPolicy API expects them.
  # @section -- NetworkPolicy
  allowedIngress: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  #  - ipBlock:
  #      cidr: 10.0.0.0/8
  # -- Additional ports accepted alongside the API port.
  # @section -- NetworkPolicy
  extraIngressPorts: []
  # -- Verbatim extra ingress rules.
  # @section -- NetworkPolicy
  extraIngress: []
  # -- Permit all egress instead of enumerating destinations. Simplest option
  # when the OIDC provider lives outside the cluster.
  # @section -- NetworkPolicy
  allowAllEgress: false
  egress:
    # -- Permit DNS to kube-dns.
    # @section -- NetworkPolicy
    dns: true
    database:
      # -- Permit egress to the database.
      # @section -- NetworkPolicy
      enabled: true
      # -- Destination peers. Defaults to 0.0.0.0/0 on the database port.
      # @section -- NetworkPolicy
      to: []
      # -- Destination port. Defaults to `database.port`.
      # @section -- NetworkPolicy
      port: null
    # -- Verbatim extra egress rules — the OIDC provider usually goes here.
    # @section -- NetworkPolicy
    extra: []
    #  - to:
    #      - namespaceSelector:
    #          matchLabels:
    #            kubernetes.io/metadata.name: keycloak
    #    ports:
    #      - port: 8443
    #        protocol: TCP

# ==============================================================================
# Pod placement and scheduling
# ==============================================================================
# -- Labels added to every object this chart renders.
# @section -- Pod, container and scheduling
commonLabels: {}
# -- Annotations added to every object this chart renders.
# @section -- Pod, container and scheduling
commonAnnotations: {}
# -- Annotations on the Deployment object itself (not the pod template). This is
# where controllers that watch Deployments read their configuration — Stakater
# Reloader, Argo CD sync options, Keel, and so on:
#
#   deploymentAnnotations:
#     reloader.stakater.com/auto: "true"
#
# The chart already stamps checksum/config, checksum/secret and checksum/ca on
# the pod template, so config it owns rolls pods without Reloader. Reloader earns
# its keep for objects the chart references but does not render:
# `database.existingSecret`, `extraEnvVarsCM`, `extraEnvVarsSecret`, and
# `trustedCAs.existingConfigMap`/`existingSecret`. See the chart README.
# @section -- Pod, container and scheduling
deploymentAnnotations: {}
# -- Extra pod annotations.
# @section -- Pod, container and scheduling
podAnnotations: {}
# -- Extra pod labels.
# @section -- Pod, container and scheduling
podLabels: {}
# -- PriorityClass for the pod.
# @section -- Pod, container and scheduling
priorityClassName: ""
# -- Grace period on pod termination.
# @section -- Pod, container and scheduling
terminationGracePeriodSeconds: 30
# -- Node selector.
# @section -- Pod, container and scheduling
nodeSelector: {}
# -- Tolerations.
# @section -- Pod, container and scheduling
tolerations: []
# -- Affinity rules.
# @section -- Pod, container and scheduling
affinity: {}
# -- Topology spread constraints.
# @section -- Pod, container and scheduling
topologySpreadConstraints: []
# -- Pod DNS policy.
# @section -- Pod, container and scheduling
dnsPolicy: ""
# -- Pod DNS config.
# @section -- Pod, container and scheduling
dnsConfig: {}
# -- Extra /etc/hosts entries.
# @section -- Pod, container and scheduling
hostAliases: []

# -- Override the image's entrypoint. The image runs `node index.js` from
# /home/node.
# @section -- Pod, container and scheduling
command: []
# -- Override the arguments.
# @section -- Pod, container and scheduling
args: []
# -- Container lifecycle hooks.
# @section -- Pod, container and scheduling
lifecycle: {}
# -- Init containers. Rendered through `tpl`.
# @section -- Pod, container and scheduling
initContainers: []
# -- Sidecar containers. Rendered through `tpl`.
# @section -- Pod, container and scheduling
sidecars: []
# -- Extra container ports on the API container.
# @section -- Pod, container and scheduling
extraContainerPorts: []

# -- Resource requests and limits. The API is a single Node process; give it
# enough memory for the STIG library it loads at startup.
# @section -- Pod, container and scheduling
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

# -- Pod-level security context.
# @section -- Pod, container and scheduling
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. `readOnlyRootFilesystem: true` requires
# `tmpVolume.enabled` — Node writes its compile cache under /tmp.
# @section -- Pod, container and scheduling
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

# Writable /tmp, required by `readOnlyRootFilesystem`.
tmpVolume:
  # -- Mount an emptyDir at /tmp. Node writes its compile cache there, so
  # `containerSecurityContext.readOnlyRootFilesystem` depends on this.
  # @section -- Pod, container and scheduling
  enabled: true
  # -- emptyDir medium. Set to `Memory` for a tmpfs.
  # @section -- Pod, container and scheduling
  medium: ""
  # -- Size limit for the emptyDir.
  # @section -- Pod, container and scheduling
  sizeLimit: 256Mi

# -- Extra volumes on the pod. Rendered through `tpl`.
# @section -- Pod, container and scheduling
extraVolumes: []
# -- Extra volume mounts on the API container. Rendered through `tpl`.
# @section -- Pod, container and scheduling
extraVolumeMounts: []

# -- Names of existing ConfigMaps to load wholesale as environment.
# @section -- Pod, container and scheduling
extraEnvVarsCM: []
# -- Names of existing Secrets to load wholesale as environment.
# @section -- Pod, container and scheduling
extraEnvVarsSecret: []
# -- Extra environment variables in raw `env:` form. Applied last, so these win
# over everything else. Rendered through `tpl`.
# @section -- Pod, container and scheduling
extraEnvVars: []
#  - name: STIGMAN_DB_TLS_KEY_PASSPHRASE
#    valueFrom:
#      secretKeyRef:
#        name: stigman-db
#        key: db-tls-key-passphrase

# ==============================================================================
# Probes
# ==============================================================================
# /api/op/state and /api/op/configuration are unauthenticated in the OpenAPI
# specification, which is what makes them usable as probe targets. /api/op/state
# answers even while the API is still waiting on its dependencies, so it is the
# liveness target; /api/op/configuration reflects database and OIDC reachability,
# so it is the readiness and startup target.
#
# Set `custom` on any probe to replace the generated block entirely, e.g.
#   livenessProbe:
#     custom:
#       exec:
#         command: [/bin/sh, -c, "..."]

# -- Startup probe. Targets /api/op/configuration, which reflects database and
# OIDC reachability. Set `custom` to replace the generated block entirely.
# @section -- Probes
startupProbe:
  enabled: true
  path: /api/op/configuration
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 30
  custom: {}

# -- Readiness probe. Same target as the startup probe, so a pod that loses its
# database or IdP leaves the Service endpoints.
# @section -- Probes
readinessProbe:
  enabled: true
  path: /api/op/configuration
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
  custom: {}

# -- Liveness probe. Targets /api/op/state, which answers even while the API is
# still waiting on its dependencies — probing anything else would restart a pod
# that is merely waiting for MySQL.
# @section -- Probes
livenessProbe:
  enabled: true
  path: /api/op/state
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
  custom: {}

# ==============================================================================
# helm test
# ==============================================================================
tests:
  # -- Render the `helm test` pod.
  # @section -- Tests
  enabled: true
  # -- Image the test pod runs. Needs nothing but curl.
  # @section -- Tests
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  # -- curl timeout, in seconds.
  # @section -- Tests
  timeout: 10
  # -- Pod-level security context for the test pod.
  # @section -- Tests
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  # -- Container-level security context for the test pod.
  # @section -- Tests
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- Resource requests and limits for the test pod.
  # @section -- Tests
  resources: {}

