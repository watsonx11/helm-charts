# .markdownlint.yaml
#
# charts/*/README.md is generated by helm-docs, so three rules below concede
# formatting the generator owns. Everything else applies to hand-written prose,
# including the .gotmpl the README is generated from.
MD013:
  line_length: 80
  code_blocks: false
  tables: false

# Chart READMEs legitimately repeat headings under different parents, and
# helm-docs emits one `### <section>` per values section.
MD024:
  siblings_only: true

# helm-docs writes `* item` in its sources and maintainers sections; the rest of
# the repository uses `-`. Not worth post-processing generated output over.
MD004: false

# helm-docs writes compact `|key|type|` table rows. Cosmetic, and not ours to
# reformat.
MD060: false
